app-id: io.github.MattBunch.Hourglass
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: hourglass-linux
finish-args:
  - --socket=x11
  - --share=ipc
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: hourglass-linux
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/lib/hourglass-linux
      - cp -a publish/. /app/lib/hourglass-linux/
      - |
        cat > /app/bin/hourglass-linux <<'EOF'
        #!/usr/bin/env bash
        exec /app/lib/hourglass-linux/hourglass-linux "$@"
        EOF
      - chmod +x /app/bin/hourglass-linux
      - install -Dm644 packaging/linux/io.github.MattBunch.Hourglass.desktop /app/share/applications/io.github.MattBunch.Hourglass.desktop
      - sed -i 's/^Icon=hourglass$/Icon=io.github.MattBunch.Hourglass/' /app/share/applications/io.github.MattBunch.Hourglass.desktop
      - install -Dm644 src/Hourglass.Linux.Avalonia/Assets/hourglass.png /app/share/icons/hicolor/256x256/apps/io.github.MattBunch.Hourglass.png
      - install -Dm644 src/Hourglass.Linux.Avalonia/Assets/hourglass.svg /app/share/icons/hicolor/scalable/apps/io.github.MattBunch.Hourglass.svg
      - install -Dm644 packaging/linux/io.github.MattBunch.Hourglass.metainfo.xml /app/share/metainfo/io.github.MattBunch.Hourglass.metainfo.xml
    sources:
      - type: dir
        path: ../..
