name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  test:
    name: Restore, build, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up .NET
        # actions/setup-dotnet v4.3.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Hourglass.Linux.sln

      - name: Build
        run: dotnet build Hourglass.Linux.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Hourglass.Linux.sln --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults --blame-hang-timeout 90s --blame-hang-dump-type none

      - name: Terminal packaging rejection fixtures
        run: python3 tests/terminal-packaging-tests.py

      - name: CLI runtime control smoke
        run: python3 tests/Hourglass.Cli.Tests/verify-control.py

      - name: Host lifetime smoke
        run: python3 tests/Hourglass.Host.Tests/verify-host.py

      - name: GUI lifetime smoke
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libx11-6 libice6 libsm6 libfontconfig1
          xvfb-run --auto-servernum python3 tests/Hourglass.Linux.Avalonia.Tests/verify-lifetime.py

      - name: TUI terminal smoke
        run: python3 tests/Hourglass.Tui.Tests/verify-terminal.py

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results
          path: |
            TestResults/*.trx
            TestResults/**/*_Sequence.xml
          if-no-files-found: ignore

      - name: Verify formatting
        run: dotnet format Hourglass.Linux.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Validate release version metadata
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            dotnet run --project tools/Hourglass.ReleaseTool/Hourglass.ReleaseTool.csproj --configuration Release --no-build -- validate-version --tag "$RELEASE_TAG"
          else
            dotnet run --project tools/Hourglass.ReleaseTool/Hourglass.ReleaseTool.csproj --configuration Release --no-build -- validate-version
          fi

  packaging:
    name: Build Linux package artifacts
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up .NET
        # actions/setup-dotnet v4.3.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Install package validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils

      - name: Publish linux-x64
        run: scripts/publish-linux-release.sh --runtime linux-x64 --output /tmp/hourglass-linux-publish

      - name: Build AppDir
        run: packaging/appimage/build-appdir.sh /tmp/hourglass-linux-publish /tmp/hourglass-linux.AppDir

      - name: Build AppImage
        id: appimage
        run: |
          version=$(dotnet msbuild src/Hourglass.Linux.Avalonia/Hourglass.Linux.Avalonia.csproj -nologo -getProperty:Version)
          appimage="/tmp/Hourglass-${version}-x86_64.AppImage"
          packaging/appimage/build-appimage.sh /tmp/hourglass-linux.AppDir "$appimage"
          (
            cd /tmp
            sha256sum "$(basename "$appimage")" > Hourglass-AppImage-SHA256SUMS
            sha256sum --check Hourglass-AppImage-SHA256SUMS
          )
          printf 'path=%s\n' "$appimage" >> "$GITHUB_OUTPUT"

      - name: Validate packaging
        env:
          HOURGLASS_REQUIRE_PACKAGE_VALIDATORS: "true"
        run: scripts/validate-linux-packaging.sh /tmp/hourglass-linux-publish /tmp/hourglass-linux.AppDir

      - name: Pack publish directory
        run: tar -C /tmp/hourglass-linux-publish -czf /tmp/hourglass-linux-linux-x64.tar.gz .

      - name: Pack AppDir
        run: tar -C /tmp -czf /tmp/hourglass-linux-AppDir.tar.gz hourglass-linux.AppDir

      - name: Upload publish artifact
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hourglass-linux-linux-x64
          path: /tmp/hourglass-linux-linux-x64.tar.gz

      - name: Upload AppDir artifact
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hourglass-linux-AppDir
          path: /tmp/hourglass-linux-AppDir.tar.gz

      - name: Upload AppImage artifact
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hourglass-linux-AppImage
          path: |
            ${{ steps.appimage.outputs.path }}
            /tmp/Hourglass-AppImage-SHA256SUMS

  terminal:
    name: Terminal package (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            runner: ubuntu-24.04
          - runtime: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Validate version
        run: dotnet run --project tools/Hourglass.ReleaseTool --configuration Release -- validate-version
      - name: Publish terminal archive
        run: scripts/publish-terminal-release.sh --runtime "${{ matrix.runtime }}" --output "$RUNNER_TEMP/terminal"
      - name: Extract and verify checksum
        run: |
          (cd "$RUNNER_TEMP/terminal" && sha256sum --check SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/terminal extracted"
          tar -xzf "$RUNNER_TEMP"/terminal/hourglass-terminal-*.tar.gz -C "$RUNNER_TEMP/terminal extracted"
          python3 scripts/validate-terminal-packaging.py "$RUNNER_TEMP/terminal extracted" "${{ matrix.runtime }}"
      - name: Execute native terminal package
        run: python3 tests/verify-terminal-package.py "$RUNNER_TEMP/terminal extracted" "${{ matrix.runtime }}"
      - name: Upload tested terminal archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terminal-${{ matrix.runtime }}
          path: ${{ runner.temp }}/terminal/hourglass-terminal-*.tar.gz
          if-no-files-found: error
