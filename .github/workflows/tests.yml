name: Tests

on:
  push:
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  test:
    name: Restore, build, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Hourglass.Linux.sln

      - name: Build
        run: dotnet build Hourglass.Linux.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Hourglass.Linux.sln --configuration Release --no-build --verbosity normal
