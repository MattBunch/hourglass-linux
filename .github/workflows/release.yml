name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up .NET
        # actions/setup-dotnet v4.3.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Validate release version metadata
        run: |
          dotnet run \
            --project tools/Hourglass.ReleaseTool/Hourglass.ReleaseTool.csproj \
            --configuration Release \
            -- \
            validate-version \
            --tag "$GITHUB_REF_NAME"

      - name: Read release version
        id: version
        run: |
          version=$(dotnet run --project tools/Hourglass.ReleaseTool/Hourglass.ReleaseTool.csproj -- version)
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Hourglass.Linux.sln

      - name: Build
        run: dotnet build Hourglass.Linux.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Hourglass.Linux.sln --configuration Release --no-build --verbosity normal

      - name: Verify formatting
        run: dotnet format Hourglass.Linux.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Install package validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils

      - name: Publish linux-x64
        run: scripts/publish-linux-release.sh --runtime linux-x64 --output "$RUNNER_TEMP/hourglass-linux-publish"

      - name: Build AppDir
        run: packaging/appimage/build-appdir.sh "$RUNNER_TEMP/hourglass-linux-publish" "$RUNNER_TEMP/hourglass-linux.AppDir"

      - name: Validate packaging
        env:
          HOURGLASS_REQUIRE_PACKAGE_VALIDATORS: "true"
        run: scripts/validate-linux-packaging.sh "$RUNNER_TEMP/hourglass-linux-publish" "$RUNNER_TEMP/hourglass-linux.AppDir"

      - name: Create and verify release archive
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          archive="dist/hourglass-linux-${RELEASE_VERSION}-linux-x64.tar.gz"
          tar -C "$RUNNER_TEMP/hourglass-linux-publish" -czf "$archive" .
          tar -tzf "$archive" | grep -Fx './hourglass-linux'
          extract_directory="$RUNNER_TEMP/hourglass-linux-extract"
          mkdir -p "$extract_directory"
          tar -xzf "$archive" -C "$extract_directory"
          test -x "$extract_directory/hourglass-linux"

      - name: Generate and verify checksums
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          cd dist
          sha256sum "hourglass-linux-${RELEASE_VERSION}-linux-x64.tar.gz" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'A GitHub Release already exists for tag %s.\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

          release_args=(
            release create "$GITHUB_REF_NAME"
            "dist/hourglass-linux-${RELEASE_VERSION}-linux-x64.tar.gz"
            dist/SHA256SUMS
            --repo "$GITHUB_REPOSITORY"
            --title "Hourglass Linux ${RELEASE_VERSION}"
            --generate-notes
          )
          if [[ "$RELEASE_VERSION" == *-beta.* ]]; then
            release_args+=(--prerelease)
          fi

          gh "${release_args[@]}"
